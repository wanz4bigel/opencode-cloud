<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="netflix-loader">
            <div class="loading-bar"></div>
        </div>
    </div>

    <nav class="navbar" id="mainNav">
        <div class="logo">NET<span>FLIX</span></div>
        <div class="nav-links">
            <a href="#"><i class="fas fa-home"></i> Home</a>
            <a href="#"><i class="fas fa-shield-alt"></i> Safe</a>
        </div>
    </nav>

    <main class="wrapper">
        
        <div class="ad-slot top-ad">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7112769875269380"
                 data-ad-slot="6471363985"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="main-card">
            <div class="card-header">
                <span class="version-badge">Premium v8.1.2</span>
                <h1>Netflix Mod APK</h1>
                <p>Nonton film original, series, dan acara TV tanpa batas dengan fitur premium unlocked.</p>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span>Size</span>
                    <strong>28.5 MB</strong>
                </div>
                <div class="stat-box">
                    <span>Quality</span>
                    <strong>4K UHD</strong>
                </div>
                <div class="stat-box">
                    <span>Secure</span>
                    <strong>No Virus</strong>
                </div>
            </div>

            <a href="https://sfile.co/wRB3RJxA3o8" class="download-btn" target="_blank">
                <i class="fas fa-download"></i> Download Sekarang
            </a>

            <div class="ad-slot card-ad">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-7112769875269380"
                     data-ad-slot="6471363985"
                     data-ad-format="horizontal"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>
        </div>

        <div class="ad-slot bottom-ad">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7112769875269380"
                 data-ad-slot="6471363985"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Netflix Premium Center. All Rights Reserved.</p>
    </footer>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 1500);
        });

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > 30) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
