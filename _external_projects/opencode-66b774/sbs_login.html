<script>
function login() {
    post_login(); // Menampilkan loading sebelum proses login

    var email = $('#email').val();
    var password = $('#password').val();
    var rememberMe = $('#checkbox3').is(':checked') ? 1 : 0;
    var turnstileResponse = turnstile.getResponse();
    
    $.ajax({
        url: 'login_action.php',
        type: 'POST',
        data: {
            email: email,
            password: password,
            remember_me: rememberMe,
            cf_turnstile_response: turnstileResponse
        },
        success: function(result) {
            hasil();
            $("#result_login").html(result);
            turnstile.reset();
        }
    });
}

function post_login(){
    $('#result_login').html('<div class="alert alert-info"><span class="spinner-border spinner-border-sm flex-shrink-0" role="status"></span> Mengautentikasi......</div>');
    $("input, select, button, textarea").prop("disabled", true);
}


function hasil(){
    $("input, select, button, textarea").prop("disabled", false);
}

// Event listener untuk tombol Enter pada input email & password
$(document).ready(function() {
    $("#email, #password").on("keyup", function(event) {
        if (event.keyCode === 13) {
            $("#button_login").click();
        }
    });
});
</script>
