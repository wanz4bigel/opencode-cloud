<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situs Sedang Perbaikan</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            margin: 20px;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            color: #E67E22;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px; /* Sedikit penyesuaian jarak */
        }
        
        /* [BARU] Gaya untuk Tombol Telegram */
        .telegram-button {
            display: inline-block; /* Agar bisa diatur padding & margin */
            background-color: #0088cc; /* Warna biru khas Telegram */
            color: #ffffff; /* Teks warna putih */
            padding: 12px 25px; /* Ukuran tombol (atas/bawah | kiri/kanan) */
            margin-top: 20px; /* Jarak dari paragraf di atasnya */
            border-radius: 8px; /* Sudut tombol melengkung */
            text-decoration: none; /* Hilangkan garis bawah default link */
            font-weight: bold; /* Teks tebal */
            font-size: 16px;
            
            /* Efek transisi saat kursor mouse menyentuh tombol */
            transition: background-color 0.3s ease;
        }

        /* [BARU] Efek saat kursor mouse di atas tombol */
        .telegram-button:hover {
            background-color: #0077b3; /* Warna jadi sedikit lebih gelap */
        }
        
    </style>
</head>
<body>

    <div class="container">
        
        <div class="icon">🛠️</div>
        
        <h1>Kami Sedang Dalam Perbaikan</h1>
        
        <p>
            Maaf atas ketidaknyamanannya. Kami sedang bekerja keras
            untuk memperbarui situs kami agar lebih baik.
        </p>
        
        <p>
            Untuk mendapatkan informasi terbaru kapan situs ini akan kembali normal,
            silakan bergabung dengan channel kami.
        </p>
        
        <a href="https://t.me/config_geratis" 
           class="telegram-button" 
           target="_blank" 
           rel="noopener noreferrer">
            Dapatkan Update di Telegram
        </a>
        
    </div>

</body>
</html>
