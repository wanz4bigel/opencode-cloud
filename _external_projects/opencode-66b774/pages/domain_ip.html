<script>
    // Skrip untuk fungsionalitas halaman (tema, copy, notifikasi)
    document.addEventListener('DOMContentLoaded', () => {
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlEl = document.documentElement;
        const setTheme = (theme) => { htmlEl.setAttribute('data-bs-theme', theme); localStorage.setItem('theme', theme); };
        themeToggleBtn.addEventListener('click', () => { const currentTheme = htmlEl.getAttribute('data-bs-theme'); setTheme(currentTheme === 'dark' ? 'light' : 'dark'); });
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme) { setTheme(savedTheme); } else { setTheme(prefersDark ? 'dark' : 'light'); }

        const copyBtn = document.getElementById('copy-button');
        if (copyBtn) {
            copyBtn.addEventListener('click', () => {
                const textToCopy = copyBtn.getAttribute('data-copy-text');
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalHtml = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check me-2"></i>Tersalin!';
                    copyBtn.classList.remove('btn-outline-secondary');
                    copyBtn.classList.add('btn-success');
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHtml;
                        copyBtn.classList.remove('btn-success');
                        copyBtn.classList.add('btn-outline-secondary');
                    }, 2000);
                }).catch(err => { console.error('Gagal menyalin: ', err); });
            });
        }

            });
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Memberi waktu lebih lama agar ad script sempat mencoba mengisi slot
    setTimeout(detectAdBlock, 1500); 
});

function detectAdBlock() {
    let adBlockerDetected = false;

    // Pengecekan #1: Elemen Umpan
    const baitElement = document.createElement('div');
    baitElement.innerHTML = ' ';
    baitElement.className = 'adsbox ad-banner ad-container ad-unit text-ad-container google-ads';
    baitElement.style.position = 'absolute';
    baitElement.style.height = '1px';
    baitElement.style.width = '1px';
    baitElement.style.top = '-10px';
    baitElement.style.left = '-10px';
    document.body.appendChild(baitElement);

    if (!baitElement.clientHeight) {
        adBlockerDetected = true;
    }
    document.body.removeChild(baitElement);
    
    // Pengecekan #2: Variabel Global Google AdSense
    if (typeof adsbygoogle === 'undefined') {
        adBlockerDetected = true;
    }

    // Pengecekan #3 (Paling Kuat): Apakah slot iklan benar-benar kosong?
    const mainAdSlot = document.getElementById('main-ad-slot');
    if (mainAdSlot && mainAdSlot.childElementCount === 0 && mainAdSlot.clientHeight === 0) {
        adBlockerDetected = true;
    }

    // Jika salah satu dari tiga pengecekan berhasil, tampilkan peringatan
    if (adBlockerDetected) {
        showAdBlockWarning();
    }
}

function showAdBlockWarning() {
    Swal.fire({
        title: 'Ad Blocker Terdeteksi!',
        html: "Website ini didukung oleh iklan agar tetap gratis.<br>Mohon nonaktifkan <b>Ad Blocker</b> Anda dan muat ulang halaman untuk mendukung kami. Terima kasih!",
        icon: 'warning',
        iconColor: '#ffc107',
        allowOutsideClick: false,
        allowEscapeKey: false,
        showCancelButton: false,
        confirmButtonText: '<i class="fas fa-sync-alt me-2"></i>Muat Ulang Halaman',
        confirmButtonColor: '#0d6efd',
        customClass: {
            popup: 'swal2-popup',
        }
    }).then((result) => {
        if (result.isConfirmed) {
            location.reload();
        }
    });
}
</script>
