<script>
    function toggleSearch() {
        const o = document.getElementById('searchOverlay');
        o.style.display = (o.style.display === 'none' || o.style.display === '') ? 'flex' : 'none';
        if(o.style.display === 'flex') o.querySelector('input').focus();
    }

    // DETEKSI ADBLOCK YANG LEBIH RAMAH
    window.onload = function() {
        setTimeout(async function() {
            let adBlockDetected = false;
            
            // Cek DOM (Bait)
            const adBait = document.createElement('div');
            adBait.className = 'adsbygoogle';
            adBait.style.position = 'absolute'; adBait.style.left = '-9999px';
            adBait.innerHTML = '&nbsp;';
            document.body.appendChild(adBait);
            
            if (adBait.offsetHeight === 0) {
                adBlockDetected = true;
            }
            adBait.remove();

            // Cek Network (Ping ke server AdSense)
            if (adBlockDetected) {
                try {
                    const check = await fetch('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js', { mode: 'no-cors' });
                } catch (e) {
                    adBlockDetected = true; // Benar-benar diblokir network
                }
            }

            // Tampilkan modal jika benar terdeteksi
            if (adBlockDetected) {
                var myModal = new bootstrap.Modal(document.getElementById('adBlockModal'));
                myModal.show();
            }
        }, 5000); // Tunggu 5 detik (lebih aman untuk koneksi lambat)
    };
</script>
