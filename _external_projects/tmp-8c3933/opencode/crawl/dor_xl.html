<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tembak Paket XL</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --bg-core: #050505; --panel: #0b0b0b; --cyan: #00f3ff; --pink: #ff003c; --green: #0aff0a; --grid: rgba(0, 243, 255, 0.1); }
        body { background-color: var(--bg-core); color: #e0e0e0; font-family: 'Share Tech Mono', monospace; min-height: 100vh; overflow-x: hidden; padding-top: 90px; padding-bottom: 80px; }
        .cyber-floor { position: fixed; bottom: 0; left: -50%; width: 200%; height: 50vh; background: linear-gradient(to bottom, transparent 0%, var(--bg-core) 100%), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 100% 100%, 40px 40px, 40px 40px; transform: perspective(500px) rotateX(60deg); animation: moveGrid 5s linear infinite; z-index: -2; opacity: 0.5; pointer-events: none; }
        @keyframes moveGrid { from { background-position: 0 0, 0 0, 0 0; } to { background-position: 0 0, 0 40px, 0 0; } }
        body::after { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); z-index: -1; background-size: 100% 2px, 3px 100%; pointer-events: none; }
        .def-card { background: var(--panel); border: 1px solid #333; position: relative; padding: 1.5rem; margin-bottom: 1.5rem; clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); transition: 0.3s; }
        .def-card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--cyan); }
        .def-card:hover { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); }
        h1, h2, h3, h4, h5, .brand-font { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
        .text-cyan { color: var(--cyan) !important; text-shadow: 0 0 8px rgba(0, 243, 255, 0.6); }
        .def-input { background: #111; border: 1px solid #444; border-left: 3px solid #444; color: white; padding: 12px; font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; width: 100%; }
        .def-input:focus { background: #151515; border-color: var(--cyan); border-left-color: var(--cyan); outline: none; color: white; box-shadow: 0 0 10px rgba(0, 243, 255, 0.1); }
        .btn-def { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); font-family: 'Orbitron', sans-serif; font-weight: bold; text-transform: uppercase; padding: 12px 0; width: 100%; position: relative; transition: 0.2s; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        .btn-def:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
        .navbar-def { background: rgba(5, 5, 5, 0.95); border-bottom: 2px solid var(--cyan); box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 5px 0; }
        .store-card { background: rgba(20, 20, 20, 0.8); border: 1px solid #333; position: relative; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; height: 100%; clip-path: polygon(15px 0, 100% 0, 100% 100%, 0 100%, 0 15px); }
        .store-card:hover { border-color: var(--cyan); background: rgba(0, 243, 255, 0.05); transform: translateY(-3px); }
        .card-top { padding: 12px; border-bottom: 1px solid #333; flex-grow: 1; }
        .card-btm { padding: 10px 12px; background: #000; display: flex; justify-content: space-between; align-items: center; }
        .btn-mini { font-size: 0.7rem; padding: 4px 10px; border: 1px solid #555; color: #888; }
        .store-card:hover .btn-mini { background: var(--cyan); color: black; border-color: var(--cyan); font-weight: bold; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .radar { width: 80px; height: 80px; border: 2px solid var(--cyan); border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 10px var(--cyan); }
        .radar::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent 0%, var(--cyan) 100%); animation: radarSpin 1.5s linear infinite; opacity: 0.5; }
        @keyframes radarSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .nav-def .nav-link { background: transparent; border: 1px solid #333; color: #666; margin: 0 2px; font-family: 'Orbitron'; letter-spacing: 1px; font-size: 0.8rem; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
        .nav-def .nav-link.active { background: rgba(0, 243, 255, 0.1); border-color: var(--cyan); color: var(--cyan); }
        .footer-def { position: fixed; bottom: 0; width: 100%; background: #020202; border-top: 1px solid #222; padding: 10px 0; z-index: 90; }
        @media (max-width: 768px) { body { padding-top: 80px; padding-bottom: 70px; } .def-card { padding: 1.2rem; margin-bottom: 1rem; } .display-6 { font-size: 2rem; } .fs-5 { font-size: 1rem !important; } .btn-def { font-size: 0.9rem; } .navbar-brand span { font-size: 1rem; } .store-grid { grid-template-columns: 1fr 1fr; gap: 10px; } .pkg-name { font-size: 0.9rem; } .pkg-price { font-size: 0.95rem; } .btn-mini { display: none; } .card-btm { justify-content: center; padding: 8px; } }
        div:where(.swal2-container) div:where(.swal2-popup) { background: #0a0a0a !important; border: 2px solid var(--cyan); border-radius: 0 !important; width: 90% !important; }
        .quota-item { background: rgba(255,255,255,0.03); border: 1px solid #222; padding: 12px; margin-bottom: 8px; border-left: 3px solid var(--cyan); }
        .pkg-name { font-family: 'Orbitron'; font-weight: 700; font-size: 0.9rem; color: white; line-height: 1.2; }
        .pkg-price { font-weight: bold; color: var(--cyan); font-size: 1rem; }
    </style>
</head>
<body>

    <div class="cyber-floor"></div>

    <div id="loading">
        <div class="radar"></div>
        <div class="mt-4 text-cyan" style="letter-spacing: 3px; font-weight: bold;">INITIALIZING...</div>
    </div>

    <nav class="navbar fixed-top navbar-def px-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-white" href="#">
                <i class="fas fa-shield-virus me-2 text-cyan"></i>
                <span class="brand-font">DOR <span class="text-cyan">XL v1</span></span>
            </a>
            <button id="navLogoutBtn" onclick="doLogout()" class="btn btn-sm btn-outline-danger d-none rounded-0 fw-bold border-2" style="font-size: 0.7rem;">LOGOUT</button>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-12 col-lg-6">

                <div id="loginSection" class="def-card mt-3">
                    <div class="d-flex align-items-center mb-4 border-bottom border-secondary pb-2">
                        <i class="fas fa-key text-cyan fs-3 me-3"></i>
                        <div><h5 class="m-0 text-white">AUTH GATEWAY</h5><small class="text-muted">SECURE CONNECTION</small></div>
                    </div>
                    <div id="step1">
                        <div class="mb-3"><label class="text-muted small mb-1">TARGET (MSISDN)</label><input type="tel" id="msisdn" class="def-input" placeholder="628xxxxxxxx"></div>
                        <button type="button" onclick="requestOtp()" class="btn-def">REQUEST ACCESS</button>
                    </div>
                    <div id="step2" style="display:none;">
                        <div class="mb-3"><label class="text-muted small mb-1">ACCESS TOKEN (OTP)</label><input type="text" id="otpCode" class="def-input text-center fs-4 fw-bold" placeholder="X X X X X X" maxlength="6"></div>
                        <button type="button" onclick="verifyOtp()" class="btn-def">AUTHENTICATE</button>
                    </div>
                </div>

                <div id="dashboardSection" style="display:none;">
                    <div class="d-flex justify-content-between mb-3 small">
                        <span class="text-cyan fw-bold">STATUS: ONLINE</span>
                        <span class="text-muted">ID: <span class="text-white">ADMIN</span></span>
                    </div>

                    <div class="def-card">
                        <div class="row align-items-center">
                            <div class="col-7"><small class="text-muted d-block mb-1">CREDITS</small><div class="display-6 fw-bold text-white">Rp <span id="valPulsa" class="text-cyan">0</span></div></div>
                            <div class="col-5 text-end"><small class="text-muted d-block mb-1">VALIDITY</small><div class="fs-5 fw-bold text-white" id="valExp">-</div></div>
                        </div>
                        <button onclick="loadDashboard()" class="btn-def mt-3" style="font-size: 0.8rem;"><i class="fas fa-sync-alt me-2"></i> RESYNC DATA</button>
                    </div>

                    <ul class="nav nav-def nav-fill mb-4" id="pills-tab" role="tablist">
                        <li class="nav-item"><button class="nav-link active" id="pills-quota-tab" data-bs-toggle="pill" data-bs-target="#pills-quota">PACKAGES</button></li>
                        <li class="nav-item"><button class="nav-link" id="pills-check-fam-tab" data-bs-toggle="pill" data-bs-target="#pills-check-fam">CEK FAMILY CODE</button></li>
                        
                        <li class="nav-item"><button class="nav-link" id="pills-xtra-tab" data-bs-toggle="pill" data-bs-target="#pills-buy" onclick="loadPackages('xtra_kuota')">XTRA KUOTA</button></li>
                        <li class="nav-item"><button class="nav-link" id="pills-edu-tab" data-bs-toggle="pill" data-bs-target="#pills-buy" onclick="loadPackages('edukasi')">EDU & Conf</button></li>
                        <li class="nav-item"><button class="nav-link" id="pills-poin-tab" data-bs-toggle="pill" data-bs-target="#pills-buy" onclick="loadPackages('poin')">TUKAR POIN</button></li>
                        <li class="nav-item"><button class="nav-link" id="pills-masif-tab" data-bs-toggle="pill" data-bs-target="#pills-buy" onclick="loadPackages('masif_bundling')">MASIF BUNDLING</button></li>
                        <li class="nav-item"><button class="nav-link" id="pills-buy-tab" data-bs-toggle="pill" data-bs-target="#pills-buy" onclick="loadPackages('addon')">ADDON XCM</button></li>
                   <li class="nav-item">
        <button class="nav-link" onclick="window.location.href='dor-xcp'">Addon XCP</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" onclick="window.location.href='dor-2gb'">2GB Reguler</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" onclick="window.location.href='sosmed'">Sosmed</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" onclick="window.location.href='sosmedv2'">Sosmed v2</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" onclick="window.location.href='eduv2'">Edukasi v2</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" onclick="window.location.href='ytbfree'">Youtube Free</button>
    </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        <div class="tab-pane fade show active" id="pills-quota"><div id="quotaList"></div></div>
                        
                        <div class="tab-pane fade" id="pills-check-fam">
                            <div class="def-card">
                                <h5 class="text-cyan mb-3"><i class="fas fa-search"></i> MANUAL FAMILY CHECKER</h5>
                                <div class="input-group mb-3">
                                    <input type="text" id="familyCodeInput" class="form-control def-input" placeholder="Paste Family Code Here..." style="border-right:0;">
                                    <button class="btn btn-def" style="width:auto; border-left:0;" onclick="checkFamilyCode()">CHECK</button>
                                </div>
                                <div id="familyList" class="mt-3 text-center text-muted small">[ RESULTS WILL APPEAR HERE ]</div>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="pills-buy">
                            <div class="def-card p-0 border-0" style="background: transparent;">
                                <div class="bg-dark p-3 border border-secondary d-flex justify-content-between align-items-center"><span class="fw-bold text-white">MODULES</span><i class="fas fa-box-open text-cyan"></i></div>
                                <div id="packageList" class="mt-2"><div class="text-center py-5 text-muted small">[ AWAITING INPUT ]</div></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="mt-4">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7112769875269380" crossorigin="anonymous"></script>
        <ins class="adsbygoogle" style="display:block; text-align:center;" data-ad-layout="in-article" data-ad-format="fluid" data-ad-client="ca-pub-7112769875269380" data-ad-slot="6471363985"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <footer class="footer-def">
        <div class="container d-flex justify-content-between align-items-center px-3">
            <small class="text-muted" style="font-size:0.7rem">Dor Xl V1 2025 | Rusmana-ID</small>
            <div class="border border-secondary px-2 bg-dark"><small class="text-cyan" style="font-size:0.7rem">VIEWS :</small> <span id="viewCount" class="text-white ms-1" style="font-size:0.7rem">0000</span></div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
<script type='text/javascript' src='js/sosial.js'></script>
  
</html>
