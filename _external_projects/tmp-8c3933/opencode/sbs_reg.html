<script>
function register() {
    post_register();
    window.scrollTo(0, 0);
    
    var name = $('#name').val();
    var username = $('#username').val();
    var email = $('#email').val();
    var password = $('#password').val();
    var confirm_password = $('#confirm_password').val();
    var tos = $('#tos').val();
    var turnstileResponse = turnstile.getResponse();
    var rememberMe = $('#checkbox3').is(':checked') ? 1 : 0;

    $.ajax({
        url: 'register_action.php',
        type: 'POST',
        data: {
            name: name,
            username: username,
            email: email,
            password: password,
            confirm_password: confirm_password,
            remember_me: rememberMe,
            cf_turnstile_response: turnstileResponse // Mengirim response CAPTCHA ke server
        },
        success: function(result) {
            hasil();
            $("#result_register").html(result);
            turnstile.reset();
        }
    });
}
</script>




<script>
function post_register(){
    $('#result_register').html('<div class="alert alert-info"><span class="spinner-border spinner-border-sm flex-shrink-0" role="status"></span> Mendaftarkan akun kamu......</div>');
    $("input").attr("disabled", "disabled");
    $("select").attr("disabled", "disabled");
    $("button").attr("disabled", "disabled");
    $("textarea").attr("disabled", "disabled");
}
function hasil(){
    $("input").removeAttr("disabled");
    $("select").removeAttr("disabled");
    $("button").removeAttr("disabled");
    $("textarea").removeAttr("disabled");
}
</script>
