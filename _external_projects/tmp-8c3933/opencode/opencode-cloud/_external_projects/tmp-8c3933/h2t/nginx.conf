worker_processes 2;
pid /tmp/h2t/nginx.pid;
error_log /tmp/h2t/logs/error.log info;
events { worker_connections 4096; }
http {
    access_log /tmp/h2t/logs/access.log;
    client_body_temp_path /tmp/h2t/body;
    proxy_temp_path /tmp/h2t/proxy;
    server {
        listen 9444 ssl;
        http2 on;
        ssl_certificate /tmp/h2t/cert.pem;
        ssl_certificate_key /tmp/h2t/key.pem;
        root /tmp/h2t/www;
        index index.html;
    }
}
