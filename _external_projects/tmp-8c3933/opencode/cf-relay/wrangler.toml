name = "strata-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Durable Object: menyimpan satu koneksi WebSocket ke agent di sandbox.
[durable_objects]
bindings = [{ name = "RELAY", class_name = "Relay" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# Hostname publik milikmu -> Worker ini (bukan tunnel lagi).
[[routes]]
pattern = "ai.wanz4bigel.dpdns.org/*"
zone_name = "wanz4bigel.dpdns.org"
