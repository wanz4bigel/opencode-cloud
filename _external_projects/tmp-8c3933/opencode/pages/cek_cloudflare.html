    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root, [data-bs-theme="light"] { --bg-color: #f8f9fa; --panel-bg: #ffffff; --panel-border: #dee2e6; --input-bg: #ffffff; --text-color: #212529; --text-secondary: #6c757d; }
        [data-bs-theme="dark"] { --bg-color: #0d1117; --panel-bg: #161b22; --panel-border: #30363d; --input-bg: #0d1117; --text-color: #c9d1d9; --text-secondary: #8b949e; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); padding: 2rem !important; }
        .form-control { background-color: var(--input-bg); }
        .footer { padding: 2rem 0; background-color: transparent; color: var(--text-secondary); font-size: 0.9em; }
        #theme-toggle .fa-sun, #theme-toggle .fa-moon { display: none; }
        [data-bs-theme="dark"] #theme-toggle .fa-sun { display: inline-block; }
        [data-bs-theme="light"] #theme-toggle .fa-moon { display: inline-block; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(13, 17, 23, 0.85); backdrop-filter: blur(5px); z-index: 1060; display: none; justify-content: center; align-items: center; color: white; flex-direction: column; }
        .loading-dots span { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background-color: var(--bs-primary); margin: 0 5px; animation: bounce 1.4s infinite ease-in-out both; }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        .loading-dots span:nth-child(3) { animation-delay: 0s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        .gradient-text {
            background: linear-gradient(45deg, var(--bs-success), var(--bs-info));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div id="loading-overlay">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <h3 class="mt-4 fw-bold">Cheking cloudflare...</h3>
    <p class="text-secondary">Harap tunggu, proses ini mungkin memakan waktu.</p>
</div>

<nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fab fa-cloudflare text-warning me-2"></i>Cloudflare Checker</a>
        <div class="ms-auto"><button id="theme-toggle" class="btn btn-outline-secondary" title="Ganti Tema"><i class="fas fa-sun"></i><i class="fas fa-moon"></i></button></div>
    </div>
</nav>

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="text-center mb-5">
                <h1 class="fw-bold display-5">Cloudflare Checker</h1>
                <p class="text-body-secondary">Periksa apakah sebuah domain atau subdomain menggunakan layanan Cloudflare.</p>
            </div>

            <div class="panel rounded-4 shadow-sm">
                <form method="POST" action="" id="domain-form">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="fas fa-globe"></i></span>
                        <input type="text" class="form-control" name="domain" placeholder="contoh.com atau blog.contoh.com" value="" required>
                        <button class="btn btn-primary" type="submit" name="check_domain">
                            <i class="fas fa-search me-2"></i>CEK
                        </button>
                    </div>
                </form>
            </div>

            
            
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlEl = document.documentElement;
        const setTheme = (theme) => { htmlEl.setAttribute('data-bs-theme', theme); localStorage.setItem('theme', theme); };
        themeToggleBtn.addEventListener('click', () => { const currentTheme = htmlEl.getAttribute('data-bs-theme'); setTheme(currentTheme === 'dark' ? 'light' : 'dark'); });
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme) { setTheme(savedTheme); } else { setTheme(prefersDark ? 'dark' : 'light'); }

        const domainForm = document.getElementById('domain-form');
        const loadingOverlay = document.getElementById('loading-overlay');
        domainForm.addEventListener('submit', () => {
            loadingOverlay.style.display = 'flex';
        });
    });
</script>
