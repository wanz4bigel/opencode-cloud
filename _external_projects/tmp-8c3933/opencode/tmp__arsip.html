<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arsip - Koperasi Nusantara</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0e1116;color:#e6edf3}
header{padding:18px 28px;background:#161b22;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
header a{color:#e6edf3;text-decoration:none;margin-left:18px;font-size:14px}
.wrap{max-width:880px;margin:0 auto;padding:40px 28px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:28px;margin-bottom:22px}
h1{margin:0 0 8px;font-size:26px}h2{font-size:18px;margin-top:0;color:#e6edf3}
p{color:#9aa7b4;line-height:1.6}
input{width:100%;padding:11px 13px;margin:6px 0 14px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px}
button{background:#238636;color:#fff;border:0;border-radius:8px;padding:11px 18px;font-size:14px;cursor:pointer}
button:hover{background:#2ea043}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:#1f6feb33;color:#79c0ff;margin-right:6px}
.flag{font-family:ui-monospace,Menlo,monospace;background:#0d1117;border:1px dashed #3fb950;padding:16px;border-radius:8px;color:#3fb950;word-break:break-all}
.err{color:#f85149;font-size:14px;margin:0 0 12px}
.muted{font-size:13px;color:#7d8590}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.item{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:16px}
.item b{display:block;margin-bottom:6px}
a.link{color:#58a6ff;text-decoration:none}
</style></head>
<body>
<header><div><strong>🏪 Koperasi Nusantara</strong></div><nav><a href="/">Beranda</a><a href="/produk">Produk</a><a href="/report">Laporan</a><a href="/login">Login</a></nav></header>
<main class="wrap"><div class="card"><h1>Tidak ditemukan</h1><p class="err">File arsip tidak ditemukan.</p></div></main>
</body></html>
