worker_processes 1;
pid /tmp/h2t/nginx.pid;
error_log /tmp/h2t/error.log warn;

events {
    worker_connections 2048;
}

http {
    access_log off;
    client_body_temp_path /tmp/h2t/body_tmp;
    proxy_temp_path /tmp/h2t/proxy_tmp;
    fastcgi_temp_path /tmp/h2t/fcgi_tmp;
    uwsgi_temp_path /tmp/h2t/uwsgi_tmp;
    scgi_temp_path /tmp/h2t/scgi_tmp;

    server {
        listen 9444 ssl;
        http2 on;
        ssl_certificate /tmp/h2t/cert.pem;
        ssl_certificate_key /tmp/h2t/key.pem;
        root /tmp/h2t/www;
        index index.html;
    }
}
